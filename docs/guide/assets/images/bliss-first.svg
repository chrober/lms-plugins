<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533" role="img" aria-labelledby="title description"><title id="title">Bliss-first selection</title><desc id="description">First establish eligible tracks. Optional guidance can favor tracks already eligible; the outside candidate does not become eligible.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="533" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><text x="40" y="42" font-size="22" text-anchor="start" font-weight="650" fill="#233435">1 · Find musically suitable tracks</text><rect x="26" y="65" width="748" height="120" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="46" y="94" font-size="18" text-anchor="start" font-weight="600" fill="#233435">Eligible candidates</text><rect x="47" y="113" width="130" height="48" rx="8" fill="#e7eeeb" stroke="#c4d2cb"/><text x="112" y="144" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">A</text><rect x="198" y="113" width="130" height="48" rx="8" fill="#e7eeeb" stroke="#c4d2cb"/><text x="263" y="144" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">B</text><rect x="349" y="113" width="130" height="48" rx="8" fill="#e7eeeb" stroke="#c4d2cb"/><text x="414" y="144" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">C</text><rect x="570" y="113" width="179" height="48" rx="8" fill="#f0f1f0" stroke="#d2d9d6"/><text x="659" y="143" font-size="17" text-anchor="middle" font-weight="500" fill="#627577">D · outside pool</text><path d="M400 191 L400 233" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="40" y="267" font-size="22" text-anchor="start" font-weight="650" fill="#233435">2 · Add optional guidance</text><rect x="26" y="282" width="748" height="118" rx="12" fill="#fff" stroke="#d0dbd6"/><rect x="47" y="306" width="213" height="64" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="153" y="330" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">A</text><text x="153" y="352" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Familiar</text><rect x="294" y="306" width="213" height="64" rx="12" fill="#e6efeb" stroke="#789980"/><text x="400" y="330" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">B</text><text x="400" y="352" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Forgotten favorite</text><rect x="541" y="306" width="213" height="64" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="647" y="330" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">C</text><text x="647" y="352" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Recently added</text><path d="M400 406 L400 443" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="147" y="449" width="506" height="64" rx="12" fill="#e6efeb" stroke="#789980"/><text x="400" y="477" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">One suitable track may be preferred</text><text x="400" y="499" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">No guaranteed selection; other rules still apply.</text></g></svg>
