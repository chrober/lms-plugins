<svg xmlns="http://www.w3.org/2000/svg" width="800" height="525" viewBox="0 0 800 525" role="img" aria-labelledby="title description">
<title id="title">Bliss-first selection</title><desc id="description">First establish eligible tracks. Optional guidance can favor tracks already eligible; the outside candidate does not become eligible.</desc>
<rect width="800" height="525" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<text x="40" y="40" font-size="22" font-weight="650" text-anchor="start" fill="#233435">1 · Find musically suitable tracks</text>
<rect x="26" y="64" width="510" height="116" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="46" y="94" font-size="19" font-weight="650" text-anchor="start" fill="#233435">Eligible candidates</text>
<rect x="47" y="110" width="130" height="48" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="112" y="141" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">A</text>
<rect x="198" y="110" width="130" height="48" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="263" y="141" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">B</text>
<rect x="349" y="110" width="130" height="48" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="414" y="141" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">C</text>
<rect x="552" y="103" width="222" height="58" rx="8" fill="#f0f1f0" stroke="#d2d9d6"/>
<text x="663" y="139" font-size="17" font-weight="500" text-anchor="middle" fill="#627577">D · outside pool</text>
<g class="connector"><path d="M281 185 V222" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M276 221 L281 230 L286 221 Z" fill="#627577"/></g>
<rect x="26" y="233" width="748" height="148" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="46" y="265" font-size="22" font-weight="650" text-anchor="start" fill="#233435">2 · Add optional guidance</text>
<rect x="47" y="284" width="213" height="74" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="153.5" y="311" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">A</text>
<text x="153.5" y="338" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Familiar</text>
<rect x="294" y="284" width="213" height="74" rx="12" fill="#e6efeb" stroke="#789980"/>
<text x="400.5" y="311" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">B</text>
<text x="400.5" y="338" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Forgotten favorite</text>
<rect x="541" y="284" width="213" height="74" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="647.5" y="311" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">C</text>
<text x="647.5" y="338" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Recently added</text>
<g class="connector"><path d="M400 386 V420" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 419 L400 428 L405 419 Z" fill="#627577"/></g>
<rect x="147" y="431" width="506" height="72" rx="12" fill="#e6efeb" stroke="#789980"/>
<text x="400" y="460" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">One suitable track may be preferred</text>
<text x="400" y="484" font-size="16" font-weight="400" text-anchor="middle" fill="#476060">No guaranteed selection; other rules still apply.</text>
</g></svg>
