<svg xmlns="http://www.w3.org/2000/svg" width="800" height="458" viewBox="0 0 800 458" role="img" aria-labelledby="title description"><title id="title">Keep your playlist order and insert bridges</title><desc id="description">A B C D stay in sequence; X is added between A and B, and Y between C and D.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs><rect width="800" height="458" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="18" y="18" width="764" height="176" rx="12" fill="#fff" stroke="#e0e5e3"/><rect x="18" y="210" width="764" height="230" rx="12" fill="#fff" stroke="#e0e5e3"/><text x="38" y="54" font-size="22" text-anchor="start" font-weight="600" fill="#233435">Before — original sequence</text><text x="38" y="246" font-size="22" text-anchor="start" font-weight="600" fill="#233435">After — original order preserved</text><rect x="74" y="82" width="86" height="60" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="117" y="119" font-size="24" text-anchor="middle" font-weight="650" fill="#233435">A</text><path d="M168 112 L262 112" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="268" y="82" width="86" height="60" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="311" y="119" font-size="24" text-anchor="middle" font-weight="650" fill="#233435">B</text><path d="M362 112 L456 112" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="462" y="82" width="86" height="60" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="505" y="119" font-size="24" text-anchor="middle" font-weight="650" fill="#233435">C</text><path d="M556 112 L650 112" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="656" y="82" width="86" height="60" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><tex