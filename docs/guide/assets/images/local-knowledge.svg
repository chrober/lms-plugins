<svg xmlns="http://www.w3.org/2000/svg" width="800" height="399" viewBox="0 0 800 399" role="img" aria-labelledby="title description"><title id="title">Local knowledge and optional online acquisition</title><desc id="description">Local music, analysis, history and learned preferences support music selection; optional external artist data can be acquired separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="399" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="20" y="20" width="760" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="40" y="50" font-size="22" text-anchor="start" font-weight="650" fill="#233435">Local resources</text><rect x="42" y="67" width="347" height="74" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="215.5" y="97" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Music + Bliss analysis</text><text x="215.5" y="122" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Sound and eligible tracks</text><rect x="411" y="67" width="347" height="74" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="584.5" y="97" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">History + preferences</text><text x="584.5" y="122" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Optional local guidance</text><path d="M215 145 L215 164" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M585 145 L585 164" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="149" y="173" width="502" height="66" rx="12" fill="#fff" stroke="#9fb9ad"/><text x="400" y="203" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Local mix or playlist selection</text><text x="400" y="228" font-size="16" text-anchor="middle" font-weight="400" fill="#476060"></text><rect x="20" y="277" width="760" height="103" rx="12" fill="#f5e5d6" stroke="#c67b47"/><text x="40" y="306" font-size="20" text-anchor="start" font-weight="650" fill="#233435">Optional online acquisition</text><text x="40" y="335" font-size="19" text-anchor="start" font-weight="400" fill="#233435">Last.fm → locally retained artist relationships</text><text x="40" y="359" font-size="16" text-anchor="start" font-weight="400" fill="#526261">Initial acquisition sends requests; reuse depends on available data.</text></g></svg>
