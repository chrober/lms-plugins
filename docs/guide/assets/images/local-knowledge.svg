<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title description">
<title id="title">Local knowledge and optional online acquisition</title><desc id="description">Local music and analysis, history and preferences support local selection. Optional Last.fm relationships can be acquired online and stored locally for reuse.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" viewBox="0 0 12 10" overflow="visible"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs>
<rect width="800" height="490" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<rect x="20" y="20" width="760" height="350" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="40" y="50" font-size="22" text-anchor="start" font-weight="650" fill="#233435">Local resources and selection</text>
<path class="connector" d="M215 146 V166 H280 V183" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="connector" d="M585 146 V166 H520 V183" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path class="connector" d="M400 295 V265" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path class="connector" d="M400 397 V351" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="42" y="67" width="347" height="74" rx="12" fill="#e6efeb" stroke="#9fb9ad"/>
<text x="215.5" y="97" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Music + Bliss analysis</text>
<text x="215.5" y="122" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Sound and eligible tracks</text>
<rect x="411" y="67" width="347" height="74" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="584.5" y="97" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">History + preferences</text>
<text x="584.5" y="122" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Optional local guidance</text>
<rect x="149" y="190" width="502" height="68" rx="12" fill="#fff" stroke="#9fb9ad"/>
<text x="400" y="218" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Local mix or playlist selection</text>
<text x="400" y="241" font-size="16" text-anchor="middle" font-weight="400" fill="#233435">Uses available local inputs</text>
<rect x="149" y="300" width="502" height="44" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="400" y="327" font-size="17" text-anchor="middle" font-weight="550" fill="#233435">Stored Last.fm artist relationships (optional)</text>
<rect x="20" y="402" width="760" height="70" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="400" y="429" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Optional online acquisition from Last.fm</text>
<text x="400" y="452" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Initial acquisition sends requests; reuse depends on available data.</text>
</g></svg>
