<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-labelledby="title description"><title id="title">Learn musical similarity preferences</title><desc id="description">Choose which of two songs sounds closer to the reference, then train a learned similarity matrix.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="374" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><text x="40" y="40" font-size="23" text-anchor="start" font-weight="650" fill="#233435">Which song sounds more like A to you?</text><rect x="245" y="63" width="310" height="78" rx="12" fill="#fff" stroke="#cbd5d3"/><text x="400" y="93" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Reference A</text><text x="400" y="118" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Listen to the example</text><path d="M400 145 L400 166" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M400 166 H204 V193 M400 166 H596 V193" stroke="#627577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="199" width="348" height="79" rx="12" fill="#e6efeb" stroke="#789980"/><text x="204" y="229" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Song B</text><text x="204" y="254" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Your choice in this example</text><rect x="422" y="199" width="348" height="79" rx="12" fill="#fff" stroke="#cbd5d3"/><text x="596" y="229" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Song C</text><text x="596" y="254" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Alternative</text><path d="M204 282 L204 302" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="400" y="333" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Your comparisons help train a personal model.</text><text x="400" y="355" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Illustrative — not the actual survey interface.</text></g></svg>
