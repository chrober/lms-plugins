<svg xmlns="http://www.w3.org/2000/svg" width="800" height="335" viewBox="0 0 800 335" role="img" aria-labelledby="title description"><title id="title">Improve the upcoming queue</title><desc id="description">Previously played and current tracks stay while upcoming tracks are rearranged.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="335" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="18" y="18" width="764" height="130" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="38" y="52" font-size="21" text-anchor="start" font-weight="650" fill="#233435">Before — what is playing and what is next</text><rect x="113.5" y="75" width="105" height="54" rx="9" fill="#f2f3f2" stroke="#cbd5d3"/><text x="166" y="109" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Played</text><rect x="230.5" y="75" width="105" height="54" rx="9" fill="#dcebdc" stroke="#789980"/><text x="283" y="109" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Now</text><rect x="347.5" y="75" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="400" y="109" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">A</text><rect x="464.5" y="75" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="517" y="109" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">B</text><rect x="581.5" y="75" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="634" y="109" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">C</text><rect x="18" y="162" width="764" height="155" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="38" y="196" font-size="21" text-anchor="start" font-weight="650" fill="#233435">After — upcoming tracks reordered</text><rect x="113.5" y="219" width="105" height="54" rx="9" fill="#f2f3f2" stroke="#cbd5d3"/><text x="166" y="253" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Played</text><rect x="230.5" y="219" width="105" height="54" rx="9" fill="#dcebdc" stroke="#789980"/><text x="283" y="253" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Now</text><rect x="347.5" y="219" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="400" y="253" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">C</text><rect x="464.5" y="219" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="517" y="253" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">A</text><rect x="581.5" y="219" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="634" y="253" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">B</text><text x="400" y="296" font-size="17" text-anchor="middle" font-weight="400" fill="#526261">Current song and playback state remain unchanged.</text></g></svg>
