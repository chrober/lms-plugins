<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title description"><title id="title">Christmas exclusion and exception</title><desc id="description">The ordinary library retains Christmas exclusion. A checked Christmas library allows suitable Christmas tracks in Lab DSTM; other filters still apply.</desc><rect width="800" height="330" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="22" y="22" width="368" height="252" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="206" y="52" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">Everyday library</text><text x="206" y="78" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Christmas exclusion active</text><g transform="translate(161 96) scale(0.9)"><path d="M50 4 L24 42 H37 L15 69 H85 L63 42 H76 Z" fill="#d9e8dd" stroke="#476060" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="69" width="12" height="16" rx="2" fill="#c6a381" stroke="#476060"/><circle cx="43" cy="27" r="3.5" fill="#d2a183" stroke="#476060" stroke-width="1.3"/><circle cx="60" cy="38" r="3.5" fill="#d2a183" stroke="#476060" stroke-width="1.3"/><circle cx="32" cy="55" r="3.5" fill="#d2a183" stroke="#476060" stroke-width="1.3"/><circle cx="61" cy="58" r="3.5" fill="#d2a183" stroke="#476060" stroke-width="1.3"/></g><circle cx="256" cy="160" r="17" fill="#f5e5d6" stroke="#b88e64" stroke-width="2"/><path d="M248 152 l16 16 M264 152 l-16 16" fill="none" stroke="#946848" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="220" font-size="17" font-weight="650" text-anchor="middle" fill="#233435">Christmas tracks excluded</text><text x="206" y="246" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Normal filters</text><rect x="410" y="22" width="368" height="252" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="594" y="5