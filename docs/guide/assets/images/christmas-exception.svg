<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="title description"><title id="title">Christmas exclusion and exception</title><desc id="description">Normal library keeps Christmas exclusion; checked library permits eligible Christmas tracks in Lab DSTM.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="290" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="22" y="22" width="368" height="218" rx="12" fill="#fff" stroke="#d0dbd6"/><rect x="410" y="22" width="368" height="218" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="206" y="55" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">Everyday library</text><text x="594" y="55" font-size="22" text-anchor="middle" font-weight="650" fill="#233435">Christmas library</text><text x="206" y="85" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Christmas exclusion active</text><text x="594" y="85" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Library exception enabled</text><rect x="61" y="108" width="290" height="64" rx="12" fill="#f0f1f0" stroke="#cbd5d3"/><text x="206" y="146" font-size="18" text-anchor="middle" font-weight="550" fill="#233435">Christmas tracks excluded</text><rect x="449" y="108" width="290" height="64" rx="12" fill="#e6efeb" stroke="#789980"/><text x="594" y="146" font-size="17" text-anchor="middle" font-weight="550" fill="#233435">Eligible Christmas tracks allowed</text><text x="206" y="211" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Normal filters</text><text x="594" y="211" font-size="17" text-anchor="middle" font-weight="400" fill="#233435">Other filters still apply</text><text x="400" y="270" font-size="18" text-anchor="middle" font-weight="650" fill="#233435">Exception applies only to Bliss (Lab) DSTM.</text></g></svg>
