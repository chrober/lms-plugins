<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title description"><title id="title">Build a local Lyrion setup</title><desc id="description">A local Lyrion server and network serve players, Material Skin controllers and an optional Now Playing display.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="480" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="170" y="24" width="460" height="85" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Lyrion server + local music</text><text x="400" y="80" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Bliss Mixer and chosen extensions</text><path d="M400 113 L400 153" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="235" y="159" width="330" height="75" rx="12" fill="#fff" stroke="#9fb9ad"/><text x="400" y="189" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Local network</text><text x="400" y="215" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Reachable server and players</text><path d="M400 238 V267 H143 V299 M400 267 V299 M400 267 H657 V299" stroke="#627577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="20" y="305" width="246" height="92" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="143" y="335" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Your players</text><text x="143" y="361" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Music playback</text><rect x="277" y="305" width="246" height="92" rx="12" fill="#fff" stroke="#cbd5d3"/><text x="400" y="335" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Material Skin</text><text x="400" y="361" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Browser / phone control</text><rect x="534" y="305" width="246" height="92" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="657" y="335" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Lyrion Display</text><text x="657" y="361" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Optional Now Playing</text><text x="400" y="436" font-size="18" text-anchor="middle" font-weight="400" fill="#526261">Internet access is optional for local listening.</text><text x="400" y="458" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Some extra services and initial setup may need it.</text></g></svg>
