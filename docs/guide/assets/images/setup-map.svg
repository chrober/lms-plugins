<svg xmlns="http://www.w3.org/2000/svg" width="800" height="518" viewBox="0 0 800 518" role="img" aria-labelledby="title description">
<title id="title">Build a local Lyrion setup</title><desc id="description">A local network connects Lyrion, native or bridged players, Material Skin controllers and an optional Now Playing display. Lines denote connectivity, not a directional data flow.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs>
<rect width="800" height="518" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<path class="connector" d="M400 116 V159" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 234 V268 H143 V299" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 268 V299" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 268 H657 V299" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="170" y="24" width="460" height="92" rx="12" fill="#e6efeb" stroke="#9fb9ad"/>
<text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Lyrion server + local music</text>
<text x="400" y="78" font-size="16" text-anchor="middle" font-weight="400" fill="#233435">Bliss Mixer and chosen extensions</text>
<text x="400" y="100" font-size="15" text-anchor="middle" font-weight="400" fill="#233435">e.g. Raspberry Pi with piCorePlayer</text>
<rect x="235" y="159" width="330" height="75" rx="12" fill="#fff" stroke="#9fb9ad"/>
<text x="400" y="189" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Local network</text>
<text x="400" y="214" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Reachable server and devices</text>
<rect x="20" y="299" width="246" height="120" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="143" y="327" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Your players</text>
<text x="143" y="350" font-size="15" text-anchor="middle" font-weight="400" fill="#233435">Squeezebox / Squeezelite</text>
<text x="143" y="372" font-size="15" text-anchor="middle" font-weight="400" fill="#233435">Android / iOS players</text>
<text x="143" y="394" font-size="14" text-anchor="middle" font-weight="400" fill="#233435">Cast / AirPlay / UPnP bridges</text>
<rect x="277" y="299" width="246" height="120" rx="12" fill="#fff" stroke="#cbd5d3"/>
<text x="400" y="327" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Material Skin</text>
<text x="400" y="350" font-size="15" text-anchor="middle" font-weight="400" fill="#233435">Browser / phone control</text>
<text x="400" y="372" font-size="14" text-anchor="middle" font-weight="400" fill="#233435">LMS Material App / LyrPlay</text>
<rect x="534" y="299" width="246" height="120" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="657" y="327" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Lyrion Display</text>
<text x="657" y="350" font-size="15" text-anchor="middle" font-weight="400" fill="#233435">Uses Material Skin</text>
<text x="400" y="450" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Lines show local connectivity, not audio or control direction.</text>
<text x="400" y="476" font-size="18" text-anchor="middle" font-weight="400" fill="#233435">Internet access is optional for local listening.</text>
<text x="400" y="498" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Some extra services and initial setup may need it.</text>
</g></svg>
