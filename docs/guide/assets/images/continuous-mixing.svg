<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-labelledby="title description"><title id="title">Keep music playing</title><desc id="description">A starting song and existing queue are followed by suitable new tracks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="210" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><text x="40" y="38" font-size="23" text-anchor="start" font-weight="650" fill="#233435">Your listening session continues</text><rect x="113.5" y="67" width="105" height="54" rx="9" fill="#dcebdc" stroke="#789980"/><text x="166" y="101" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Now</text><rect x="230.5" y="67" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="283" y="101" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">A</text><rect x="347.5" y="67" width="105" height="54" rx="9" fill="#e4e9e7" stroke="#b9c6c2"/><text x="400" y="101" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">B</text><rect x="464.5" y="67" width="105" height="54" rx="9" fill="#dcebf8" stroke="#719bc1"/><text x="517" y="101" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">+</text><rect x="581.5" y="67" width="105" height="54" rx="9" fill="#dcebf8" stroke="#719bc1"/><text x="634" y="101" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">+</text><text x="400" y="151" font-size="20" text-anchor="middle" font-weight="500" fill="#233435">Bliss (Lab) selects new eligible songs when needed.</text><rect x="40" y="171" width="22" height="18" rx="4" fill="#dcebdc" stroke="#789980"/><text x="72" y="187" font-size="16" text-anchor="start" font-weight="400" fill="#233435">Playing</text><rect x="154.5" y="171" width="22" height="18" rx="4" fill="#e4e9e7" stroke="#b9c6c2"/><text x="186.5" y="187" font-size="16" text-anchor="start" font-weight="400" fill="#233435">Already queued</text><rect x="328.5" y="171" width="22" height="18" rx="4" fill="#dcebf8" stroke="#719bc1"/><text x="360.5" y="187" font-size="16" text-anchor="start" font-weight="400" fill="#233435">New choice</text></g></svg>
