<svg xmlns="http://www.w3.org/2000/svg" width="800" height="418" viewBox="0 0 800 418" role="img" aria-labelledby="title description"><title id="title">One foundation, two extensions</title><desc id="description">Bliss Mixer supplies both extensions; either extension can optionally use Library Signals and Last.fm Guidance.</desc><rect width="800" height="418" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="190" y="22" width="420" height="76" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="54" font-size="23" font-weight="650" text-anchor="middle" fill="#233435">Bliss Mixer</text><text x="400" y="78" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Sound-based analysis</text><path d="M400 102 V121 H200 M400 121 H600" stroke="#627577" stroke-width="2.5" fill="none"/><path d="M200 121 V135" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 134 L200 143 L205 134 Z" fill="#627577"/><path d="M600 121 V135" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 134 L600 143 L605 134 Z" fill="#627577"/><rect x="24" y="146" width="352" height="78" rx="12" fill="#e4eff8" stroke="#96b7d0"/><rect x="424" y="146" width="352" height="78" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="200" y="177" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">Better Call Bliss</text><text x="200" y="201" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Playlists and queues</text><text x="600" y="177" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">Bliss Mixer Lab</text><text x="600" y="201" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Automatic and personal mixes</text><path d="M200 274 V235" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M195 236 L200 227 L205 236 Z" fill="#627577"/><path d="M600 274 V235" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M595 236 L600 227 L605 236 Z" fill="#627577"/><rect x="24" y="278" width="752" height="105" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="400" y="304" font-size="20" font-weight="650" text-anchor="middle" fill="#233435">Optional guidance for either extension</text><text x="210" y="339" font-size="20" font-weight="650" text-anchor="middle" fill="#233435">Library Signals</text><text x="210" y="361" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Listening history</text><text x="590" y="339" font-size="20" font-weight="650" text-anchor="middle" fill="#233435">Last.fm Guidance</text><text x="590" y="361" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Musical relationships</text><text x="400" y="406" font-size="16" font-weight="400" text-anchor="middle" fill="#233435">Enable each guidance plugin where you want to use it.</text></g></svg>
