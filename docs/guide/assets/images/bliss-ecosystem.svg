<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-labelledby="title description"><title id="title">Bliss plugin ecosystem</title><desc id="description">Bliss Mixer supplies both independent main extensions. Library Signals and Last.fm Guidance are optional providers for either host.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="466" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="190" y="22" width="420" height="82" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="52" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss Mixer</text><text x="400" y="78" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Required acoustic analysis</text><path d="M400 108 V135 H201 V165 M400 135 H599 V165" fill="none" stroke="#627577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="170" width="342" height="83" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="201" y="200" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Better Call Bliss</text><text x="201" y="226" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Playlists and queues</text><rect x="428" y="170" width="342" height="83" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="599" y="200" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss Mixer Lab</text><text x="599" y="226" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Personal and automatic mixes</text><text x="400" y="285" font-size="19" text-anchor="middle" font-weight="600" fill="#233435">Optional guidance for either host</text><rect x="30" y="321" width="342" height="82" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="201" y="351" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Library Signals</text><text x="201" y="377" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Listening history and library age</text><rect x="428" y="321" width="342" height="82" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="599" y="351" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Last.fm Guidance</text><text x="599" y="377" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Related artists and tracks</text><path d="M201 316 V304 H599 V258 M599 316 V304 H201 V258" stroke="#627577" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/><text x="400" y="441" font-size="17" text-anchor="middle" font-weight="400" fill="#526261">Solid: required foundation   ·   Dashed: optional guidance</text></g></svg>
