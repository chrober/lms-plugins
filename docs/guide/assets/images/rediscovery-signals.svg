<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title description">
<title id="title">Three approaches to rediscovery</title><desc id="description">Clock for long-unheard favorites, gem for rarely played tracks, and calendar plus for newly added music.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs>
<rect width="800" height="370" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<text x="400" y="44" font-size="24" text-anchor="middle" font-weight="650" fill="#233435">Different ways to rediscover your collection</text>
<rect x="22" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="144" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Forgotten favorites</text>
<text x="144" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Last played long ago</text>
<circle cx="144" cy="199" r="52" fill="#e4eff8" stroke="#96b7d0" stroke-width="2"/>
<g transform="translate(114 169) scale(2.5)" fill="none" stroke="#476060" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</g><text x="144" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Months ago</text>
<rect x="278" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="400" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Hidden gems</text>
<text x="400" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Low play count</text>
<circle cx="400" cy="199" r="52" fill="#e6efeb" stroke="#9fb9ad" stroke-width="2"/>
<g transform="translate(370 169) scale(2.5)" fill="none" stroke="#476060" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 7 4h10l4 5-9 11L3 9Z M3 9h18 M7 4l5 16 5-16"/>
</g><text x="400" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Rarely played</text>
<rect x="534" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="656" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">New discoveries</text>
<text x="656" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Recent library additions</text>
<circle cx="656" cy="199" r="52" fill="#f5e9db" stroke="#d7b18b" stroke-width="2"/>
<g transform="translate(626 169) scale(2.5)" fill="none" stroke="#476060" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/>
<path d="M8 3v4 M16 3v4 M4 10h16 M12 12v5 M9.5 14.5h5"/>
</g><text x="656" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Just added</text>
<text x="400" y="345" font-size="18" text-anchor="middle" font-weight="400" fill="#526261">Choose the preference that suits your listening goal.</text>
</g></svg>
