<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="title description"><title id="title">Three approaches to rediscovery</title><desc id="description">Prefer tracks not heard in a long time, tracks rarely played, or recent additions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="370" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><text x="34" y="44" font-size="24" text-anchor="start" font-weight="650" fill="#233435">Different ways to rediscover your collection</text><rect x="22" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="144" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Forgotten favorites</text><text x="144" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Last played long ago</text><circle cx="144" cy="199" r="52" fill="#e4eff8" stroke="#96b7d0" stroke-width="2"/><path d="M144 165 V201 L168 216 M112 198 A32 32 0 1 1 176 198" fill="none" stroke="#476060" stroke-width="4" stroke-linecap="round"/><text x="144" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Months ago</text><rect x="278" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="400" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">Hidden gems</text><text x="400" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Low play count</text><circle cx="400" cy="199" r="52" fill="#e6efeb" stroke="#9fb9ad" stroke-width="2"/><path d="M375 217 V202 M392 217 V188 M409 217 V179 M426 217 V165" stroke="#476060" stroke-width="7" stroke-linecap="round" opacity=".8"/><circle cx="375" cy="202" r="5" fill="#e6efeb"/><text x="400" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Rarely played</text><rect x="534" y="70" width="244" height="240" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="656" y="102" font-size="20" text-anchor="middle" font-weight="650" fill="#233435">New discoveries</text><text x="656" y="129" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Recent library additions</text><circle cx="656" cy="199" r="52" fill="#f5e9db" stroke="#d7b18b" stroke-width="2"/><rect x="631" y="174" width="50" height="50" rx="8" fill="none" stroke="#476060" stroke-width="3"/><path d="M656 183 V215 M640 199 H672" stroke="#476060" stroke-width="4" stroke-linecap="round"/><text x="656" y="281" font-size="18" text-anchor="middle" font-weight="600" fill="#233435">Just added</text><text x="400" y="345" font-size="18" text-anchor="middle" font-weight="400" fill="#526261">Choose the preference that suits your listening goal.</text></g></svg>
