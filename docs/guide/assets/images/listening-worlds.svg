<text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Your local music collection</text>
<text x="400" y="79" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Albums, tracks and listening history</text>
<rect x="190" y="150" width="420" height="82" rx="12" fill="#fff" stroke="#9fb9ad"/>
<text x="400" y="180" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss Mixer</text>
<text x="400" y="205" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Sound-based analysis and mixes</text>
<rect x="30" y="288" width="350" height="84" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="205" y="318" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Playlists</text>
