<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" role="img" aria-labelledby="title description"><title id="title">One collection, more ways to listen</title><desc id="description">Bliss Mixer is the sound-based foundation for playlist work and continuous mixes; optional guidance can support rediscovery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="484" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="190" y="24" width="420" height="82" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Your local music collection</text><text x="400" y="80" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Albums, tracks and listening history</text><path d="M400 110 L400 159" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="190" y="165" width="420" height="82" rx="12" fill="#fff" stroke="#9fb9ad"/><text x="400" y="195" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss Mixer</text><text x="400" y="221" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Sound-based analysis and mixes</text><path d="M400 251 L400 278" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M130 278 H670 M130 278 V311 M400 278 V311 M670 278 V311" fill="none" stroke="#627577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="22" y="318" width="242" height="104" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="143" y="348" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Playlists</text><text x="143" y="374" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Better Call Bliss</text><rect x="279" y="318" width="242" height="104" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="348" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Continuous mixes</text><text x="400" y="374" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Bliss Mixer Lab</text><rect x="536" y="318" width="242" height="104" rx="12" fill="#f5e9db" stroke="#d7b18b"/><text x="657" y="348" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Rediscovery</text><text x="657" y="374" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Optional guidance</text><text x="400" y="459" font-size="18" text-anchor="middle" font-weight="400" fill="#526261">Choose the experiences that suit your listening habits.</text></g></svg>
