<svg xmlns="http://www.w3.org/2000/svg" width="800" height="437" viewBox="0 0 800 437" role="img" aria-labelledby="title description">
<title id="title">Acoustic similarity and optional Last.fm guidance</title><desc id="description">Bliss identifies eligible local tracks A, B and C; D stays outside. Optional Last.fm relationships may favor B when the host selects from the eligible pool.</desc>
<rect width="800" height="437" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<rect x="112" y="24" width="320" height="76" rx="12" fill="#e6efeb" stroke="#9fb9ad"/>
<text x="272" y="55" font-size="21" font-weight="650" text-anchor="middle" fill="#233435">Your reference song</text>
<text x="272" y="79" font-size="16" font-weight="400" text-anchor="middle" fill="#476060">Bliss acoustic similarity</text>
<g class="connector"><path d="M272 103 V121" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round"/><path d="M267 120 L272 129 L277 120 Z" fill="#627577"/></g>
<rect x="32" y="132" width="480" height="112" rx="12" fill="#fff" stroke="#d0dbd6"/>
<text x="50" y="162" font-size="19" font-weight="650" text-anchor="start" fill="#233435">Eligible local music</text>
<rect x="48" y="181" width="138" height="46" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="117" y="211" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">A</text>
<rect x="203" y="181" width="138" height="46" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="272" y="211" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">B</text>
<rect x="358" y="181" width="138" height="46" rx="8" fill="#e4e9e7" stroke="#b9c6c2"/>
<text x="427" y="211" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">C</text>
<rect x="552" y="151" width="216" height="76" rx="12" fill="#f0f1f0" stroke="#cbd5d3"/>
<text x="660" y="180" font-size="19" font-weight="650" text-anchor="middle" fill="#233435">D · outside pool</text>
<text x="660" y="203" font-size="16" font-weight="400" text-anchor="middle" fill="#526261">Not eligible</text>
<g class="connector"><path d="M272 247 V292" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round"/><path d="M267 291 L272 300 L277 291 Z" fill="#627577"/></g>
<rect x="32" y="303" width="480" height="88" rx="12" fill="#dcebf8" stroke="#719bc1"/>
<text x="272" y="335" font-size="23" font-weight="650" text-anchor="middle" fill="#233435">B may be favored</text>
<text x="272" y="364" font-size="17" font-weight="400" text-anchor="middle" fill="#476060">One eligible candidate, not a guarantee.</text>
<rect x="552" y="303" width="216" height="88" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="660" y="333" font-size="19" font-weight="650" text-anchor="middle" fill="#233435">Last.fm guidance</text>
<text x="660" y="358" font-size="15" font-weight="400" text-anchor="middle" fill="#476060">Artist / track relationships</text>
<g class="connector"><path d="M549 347 H523" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><path d="M524 342 L515 347 L524 352 Z" fill="#627577"/></g>
<text x="400" y="418" font-size="16" font-weight="400" text-anchor="middle" fill="#526261">Solid: eligible music   ·   Dashed: optional guidance</text>
</g></svg>
