<svg xmlns="http://www.w3.org/2000/svg" width="800" height="395" viewBox="0 0 800 395" role="img" aria-labelledby="title description">
<title id="title">Take your local music along</title><desc id="description">Raspberry Pi with local music and analysis connects through a local network to a controller and player. Lines denote local connectivity.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs>
<rect width="800" height="395" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<path class="connector" d="M400 109 V150" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 227 V251 H200 V279" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 251 H600 V279" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="148" y="24" width="504" height="85" rx="12" fill="#e6efeb" stroke="#9fb9ad"/>
<text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Raspberry Pi · e.g. piCorePlayer</text>
<text x="400" y="79" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Lyrion, music storage, prepared Bliss analysis</text>
<rect x="244" y="150" width="312" height="77" rx="12" fill="#fff" stroke="#cbd5d3"/>
<text x="400" y="180" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Local network</text>
<text x="400" y="205" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">No internet route required</text>
<rect x="24" y="279" width="352" height="72" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="200" y="309" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Controller</text>
<text x="200" y="334" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Phone or tablet</text>
<rect x="424" y="279" width="352" height="72" rx="12" fill="#f5e9db" stroke="#d7b18b"/>
<text x="600" y="309" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Player</text>
<text x="600" y="334" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Local playback</text>
<text x="400" y="379" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Lines show local connectivity.</text>
</g></svg>
