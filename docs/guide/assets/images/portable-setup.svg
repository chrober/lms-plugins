<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title description"><title id="title">Take your local music along</title><desc id="description">Raspberry Pi with music storage and completed analysis connects to a controller and player over a local network. Internet not required for local playback.</desc><rect width="800" height="460" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><path d="M400 164 V194 M400 275 V300 H205 V324 M400 300 H595 V324" fill="none" stroke="#627577" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="20" width="520" height="144" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><g transform="translate(157 40) scale(1)"><rect x="4" y="8" width="90" height="60" rx="8" fill="#d9e8dd" stroke="#476060"/><rect x="29" y="23" width="29" height="29" rx="3" fill="#8ba69a" stroke="#476060"/><rect x="65" y="14" width="24" height="17" rx="2" fill="#e4e9e7" stroke="#476060"/><rect x="65" y="37" width="24" height="23" rx="2" fill="#e4e9e7" stroke="#476060"/><path d="M18 28 H28 M18 36 H28 M18 44 H28" fill="none" stroke="#789980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(257 40) scale(1)"><rect x="8" y="9" width="65" height="56" rx="8" fill="#dcebf8" stroke="#476060"/><circle cx="40" cy="33" r="17" fill="#f8fbfd" stroke="#476060" stroke-width="2"/><path d="M40 33 L53 23 M16 55 H24" fill="none" stroke="#476060" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="476" y="62" font-size="23" font-weight="650" text-anchor="middle" fill="#233435">Raspberry Pi</text><text x="476" y="86" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">e.g. piCorePlayer</text><text x="400" y="139" font-size="18" font-weight="400" text-anchor="middle" fill="#233435">Local music · Lyrion · Prepared Bliss analysis</text><rect x="244" y="194" width="312" height="81" rx="12" fill="#fff" stroke="#d0dbd6"/><text x="400" y="224" font-size="22" font-weight="650" text-anchor="middle" fill="#233435">Local network</text><text x="400" y="249" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">No internet route required</text><rect x="24" y="324" width="352" height="108" rx="12" fill="#e4eff8" stroke="#96b7d0"/><g transform="translate(48 338) scale(1)"><rect x="21" y="3" width="46" height="74" rx="7" fill="#dcebf8" stroke="#476060"/><rect x="26" y="12" width="36" height="51" rx="3" fill="#fff" stroke="#719bc1"/><path d="M38 69 H50 M34 20 H54 M34 30 H54 M34 40 H48" fill="none" stroke="#719bc1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="230" y="366" font-size="23" font-weight="650" text-anchor="middle" fill="#233435">Controller</text><text x="230" y="392" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Phone or tablet</text><rect x="424" y="324" width="352" height="108" rx="12" fill="#f5e9db" stroke="#d7b18b"/><g transform="translate(448 338) scale(1)"><rect x="23" y="3" width="52" height="74" rx="5" fill="#f5e9db" stroke="#476060"/><circle cx="49" cy="22" r="9" fill="#f8fbfd" stroke="#476060" stroke-width="2"/><circle cx="49" cy="51" r="17" fill="#d7b18b" stroke="#476060" stroke-width="2"/><circle cx="49" cy="51" r="6" fill="#f8fbfd" stroke="#476060" stroke-width="2"/></g><text x="630" y="366" font-size="23" font-weight="650" text-anchor="middle" fill="#233435">Player</text><text x="630" y="392" font-size="17" font-weight="400" text-anchor="middle" fill="#233435">Local playback</text></g></svg>
