<svg xmlns="http://www.w3.org/2000/svg" width="800" height="275" viewBox="0 0 800 275" role="img" aria-labelledby="title description"><title id="title">Artist identity and collaborations</title><desc id="description">A solo artist and a collaboration share an artist; another artist does not.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="275" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><text x="40" y="40" font-size="23" text-anchor="start" font-weight="650" fill="#233435">What counts as the same artist?</text><rect x="28" y="66" width="235" height="88" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="145.5" y="96" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Artist A</text><text x="145.5" y="121" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Solo track</text><rect x="282" y="66" width="235" height="88" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="399.5" y="96" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">A + B</text><text x="399.5" y="121" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Collaboration</text><rect x="537" y="66" width="235" height="88" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="654.5" y="96" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Artist C</text><text x="654.5" y="121" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Different credit</text><path d="M145 162 V189 H399 V162" fill="none" stroke="#719bc1" stroke-width="3"/><text x="272" y="215" font-size="19" text-anchor="middle" font-weight="650" fill="#233435">Shared artist A</text><text x="400" y="253" font-size="17" text-anchor="middle" font-weight="400" fill="#526261">Any shared credited artist treats the first two as a repeat.</text></g></svg>
