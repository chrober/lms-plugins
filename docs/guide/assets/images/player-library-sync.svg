<svg xmlns="http://www.w3.org/2000/svg" width="800" height="565" viewBox="0 0 800 565" role="img" aria-labelledby="title description">
<title id="title">Synchronize Material and player libraries</title><desc id="description">Material's selected virtual library can set the player's library; optional reverse sync reflects the player in Material; both hosts use player library context for applicable new candidates.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" viewBox="0 0 12 10" overflow="visible"><path d="M0 0 L10 5 L0 10 Z" fill="#627577"/></marker></defs>
<rect width="800" height="565" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435">
<path class="connector" d="M400 107 V136" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="connector" d="M370 226 V277" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="connector" d="M430 279 V228" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path class="connector" d="M400 367 V400" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="connector" d="M400 400 H200 V418" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path class="connector" d="M400 400 H600 V418" fill="none" stroke="#627577" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="174" y="24" width="452" height="78" rx="12" fill="#fff" stroke="#cbd5d3"/>
<text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Virtual libraries</text>
<text x="400" y="79" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">e.g. Christmas, Summer, Jazz</text>
<rect x="174" y="143" width="452" height="78" rx="12" fill="#e4eff8" stroke="#96b7d0"/>
<text x="400" y="173" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Material library picker</text>
<text x="400" y="198" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Choose a collection for the selected player</text>
<text x="350" y="255" font-size="16" text-anchor="end" font-weight="400" fill="#233435">Material to player</text>
<text x="450" y="255" font-size="16" text-anchor="start" font-weight="400" fill="#233435">Player to Material (optional)</text>
<rect x="174" y="284" width="452" height="78" rx="12" fill="#e6efeb" stroke="#9fb9ad"/>
<text x="400" y="314" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Selected player's library</text>
<text x="400" y="339" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Actual player-level setting</text>
<rect x="24" y="425" width="352" height="90" rx="12" fill="#fff" stroke="#9fb9ad"/>
<text x="200" y="455" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss (Lab) DSTM</text>
<text x="200" y="480" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">New eligible tracks in this library</text>
<rect x="424" y="425" width="352" height="90" rx="12" fill="#fff" stroke="#96b7d0"/>
<text x="600" y="455" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Better Call Bliss</text>
<text x="600" y="480" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Default scope for new candidates</text>
<text x="400" y="544" font-size="16" text-anchor="middle" font-weight="400" fill="#526261">Explicit candidate-library choices may override the default.</text>
</g></svg>
