<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title description"><title id="title">Synchronize Material and player libraries</title><desc id="description">Material's selected virtual library can set the player's library; optional reverse sync reflects the player in Material; both hosts use the library for applicable candidate selection.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627577"/></marker></defs><rect width="800" height="540" rx="16" fill="#f3f5f4"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#233435"><rect x="174" y="24" width="452" height="78" rx="12" fill="#fff" stroke="#cbd5d3"/><text x="400" y="54" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Virtual libraries</text><text x="400" y="79" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">e.g. Christmas, Summer, Jazz</text><path d="M400 106 L400 137" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="174" y="143" width="452" height="78" rx="12" fill="#e4eff8" stroke="#96b7d0"/><text x="400" y="173" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Material library picker</text><text x="400" y="198" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Choose a collection for the selected player</text><path d="M370 225 L370 278" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M430 278 L430 225" fill="none" stroke="#627577" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="48" y="254" font-size="16" text-anchor="start" font-weight="400" fill="#233435">Material → player</text><text x="455" y="254" font-size="16" text-anchor="start" font-weight="400" fill="#233435">Reverse (optional)</text><rect x="174" y="284" width="452" height="78" rx="12" fill="#e6efeb" stroke="#9fb9ad"/><text x="400" y="314" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Selected player's library</text><text x="400" y="339" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Actual player-level setting</text><path d="M400 366 L400 390" fill="none" stroke="#627577" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M400 390 H202 V419 M400 390 H598 V419" fill="none" stroke="#627577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="425" width="352" height="90" rx="12" fill="#fff" stroke="#9fb9ad"/><text x="200" y="455" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Bliss (Lab) DSTM</text><text x="200" y="480" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">New eligible tracks in this library</text><rect x="424" y="425" width="352" height="90" rx="12" fill="#fff" stroke="#96b7d0"/><text x="600" y="455" font-size="21" text-anchor="middle" font-weight="650" fill="#233435">Better Call Bliss</text><text x="600" y="480" font-size="16" text-anchor="middle" font-weight="400" fill="#476060">Default scope for new candidates</text></g></svg>
