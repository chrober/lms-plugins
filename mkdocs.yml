site_name: Lyrion Plugins User Guide
site_description: Make more of your music collection with Bliss extensions for Lyrion Music Server.
site_url: https://chrober.github.io/lms-plugins/
repo_url: https://github.com/chrober/lms-plugins
repo_name: chrober/lms-plugins
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
site_dir: site
strict: true
use_directory_urls: true
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/music-note
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/guide.css
nav:
  - Home: index.md
  - Getting started:
      - Understanding Bliss: understanding-bliss.md
      - Build your Lyrion setup: getting-started.md
  - Listening scenarios:
      - Make your playlists flow: make-your-playlists-flow.md
      - Rediscover your music: rediscover-your-music.md
