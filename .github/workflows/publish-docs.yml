name: Publish user guide

# Initial launch is deliberately manual. Enable Pages (GitHub Actions)
# in repository settings after review before dispatching this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Confirm publication of the reviewed default branch
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: user-guide-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - run: python scripts/validate-guide.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site
        id: deployment
        uses: actions/deploy-pages@v4
